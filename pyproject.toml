[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mac-twin"
version = "0.1.0"
description = "Capture a Mac's setup into a git-friendly folder and apply it on another Mac."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [{ name = "Cenk Akin" }]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
mac-twin = "mac_twin.cli:main"

[tool.ruff]
line-length = 110
